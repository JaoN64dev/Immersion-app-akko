# Publishes the website/ folder on GitHub Pages: https://jaon64dev.github.io/Immersion-app-akko/
# Runs when something in website/ changes on main1 (or by hand: Actions → website → Run workflow).
# Once: Settings → Pages → Source: "GitHub Actions".
name: website

on:
  push:
    branches: [main1]
    paths: ['website/**', '.github/workflows/website.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
