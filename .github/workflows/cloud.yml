# akko's online service (cloud/): applies the database's tables and deploys the Worker when cloud/
# changes on main, or by hand. Needs the CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and
# CLOUDFLARE_D1_ID secrets (cloud/README.md); without them it says so and stops.
name: cloud

on:
  push:
    branches: [main, main1]
    paths: ["cloud/**", ".github/workflows/cloud.yml"]
  workflow_dispatch:

concurrency: cloud

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Secrets present?
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "${{ secrets.CLOUDFLARE_D1_ID }}" ]; then
            echo "::warning::The Cloudflare secrets aren't set yet (cloud/README.md): nothing deployed."
            echo "skip=1" >> "$GITHUB_ENV"
          fi
      - name: The database's id
        if: env.skip != '1'
        run: sed -i 's/D1_DATABASE_ID/${{ secrets.CLOUDFLARE_D1_ID }}/' wrangler.toml
      - name: Tables
        if: env.skip != '1'
        run: npx --yes wrangler@4 d1 execute akko --remote --file schema.sql
      # what a failed deploy most often is missing, said before wrangler's own error
      - name: The bucket
        if: env.skip != '1'
        run: |
          npx --yes wrangler@4 whoami
          if out=$(npx --yes wrangler@4 r2 bucket list 2>&1); then
            echo "$out"
            if ! grep -qw akko-recordings <<<"$out"; then
              echo "::error::There's no R2 bucket called akko-recordings. Enable R2 in the Cloudflare dashboard (R2 Object Storage → Enable R2), then run 'npx wrangler r2 bucket create akko-recordings' from cloud/ (cloud/README.md, step 2): the Worker binds it as MEDIA."
              exit 1
            fi
          else
            # no R2 permission on the token, or R2 not enabled: don't block the deploy over a guess
            echo "$out"
            echo "::warning::Couldn't list the R2 buckets: R2 may not be enabled yet, or the API token has no Account → Workers R2 Storage permission. If the bucket exists, add R2 Read to the token (cloud/README.md, step 3)."
          fi
      - name: Deploy
        if: env.skip != '1'
        run: npx --yes wrangler@4 deploy
